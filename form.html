<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Formulario de Información</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #FAEBD7;
            /* tono crema */
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            color: brown;
            margin-bottom: 10px;
        }

        form {
            background-color: #F5DEB3;
            border: 1px solid #D2B48C;
            padding: 15px;
        }

        fieldset {
            border: 1px solid #D2B48C;
            margin-bottom: 15px;
            padding: 10px 15px 15px 15px;
        }

        legend {
            font-weight: bold;
            font-size: 18px;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Estilo general para las etiquetas */
        label {
            display: inline-block;
            width: 160px;
            margin-bottom: 8px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
        }

        input[type="text"],
        input[type="password"],
        select,
        textarea {
            font-size: 14px;
            padding: 2px 4px;
        }

        textarea {
            width: 250px;
            height: 80px;
        }

        .options_block {
            margin: 10px 0;
        }

        .acciones {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>Formulario de Información</h1>

    <form action="formulario.php" method="POST">
        <fieldset>
            <legend>Sus Datos</legend>

            <div>
                <label for="name">Nombre y apellidos:</label>
                <input type="text" id="name" name="name" maxlength="50">
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" maxlength="8">
            </div>

            <div>
                <label for="user">Usuario:</label>
                <input type="text" id="user" name="user" value="anónimo" disabled>
            </div>

            <div class="options_block">
                <span style="font-size:18px;">Nivel:</span><br>
                <input type="radio" id="professional_level" name="level" value="profesional">
                <label for="professional_level">Profesional</label><br>

                <input type="radio" id="advanced_level" name="level" value="avanzado" checked>
                <label for="advanced_level">Avanzado</label><br>

                <input type="radio" id="basic_level" name="level" value="principiante">
                <label for="basic_level">Principiante</label>
            </div>
        </fieldset>

        <div>
            <label for="nationality">Nacionalidad:</label>
            <select id="nationality" name="nationality">
                <option value="es">España</option>
                <option value="fr">Francia</option>
                <option value="pt">Portugal</option>
                <option value="it">Italia</option>
            </select>
        </div>

        <div style="margin-top:10px;">
            <label for="description">Descripción:</label><br>
            <textarea id="description" name="description"></textarea>
        </div>

        <div class="options_block">
            <input type="checkbox" id="info" name="info" checked>
            <label for="info">Deseo recibir información sobre novedades y ofertas</label>
        </div>

        <div class="options_block">
            <input type="checkbox" id="conditions" name="conditions">
            <label for="conditions">
                Declaro haber leído y aceptar las condiciones generales del programa y la normativa sobre protección de
                datos
            </label>
        </div>

        <div class="options_block">
            <label for="picture">Adjuntar foto:</label>
            <input type="file" id="picture" name="picture">
        </div>

        <div class="actions">
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar datos">
        </div>
    </form>

</body>

</html>
